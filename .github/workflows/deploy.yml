name: Extract, build and deploy Apex Nutrition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project into repository root and remove ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "apex-nutrition.zip" ]; then
            mkdir -p /tmp/apex-source
            unzip -q apex-nutrition.zip -d /tmp/apex-source
            test -d /tmp/apex-source/apex-nutrition
            rsync -a --exclude=node_modules --exclude=dist /tmp/apex-source/apex-nutrition/ ./
            rm -rf node_modules dist
            rm -f apex-nutrition.zip
          fi

      - name: Configure Vite for GitHub Pages
        run: |
          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';
          export default defineConfig({
            base: '/Apex-Frontend-Project./',
          });
          EOF

      - name: Make project assets work under the GitHub Pages base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('src/main.js')
          source = main.read_text()
          source = source.replace(
              'import "./style.css";',
              'import "./style.css";\nconst asset = (path) => import.meta.env.BASE_URL + path.replace(/^\\//, "");'
          )
          source = re.sub(r'src="/products/([^"]+)"', r'src="\${asset("products/\1")}"', source)
          source = source.replace('<section class="hero">', '<section class="hero" id="home">')
          source = source.replace('<section class="products">', '<section class="products" id="products">')
          source = source.replace('<section class="about">', '<section class="about" id="about">')
          source = source.replace('<section class="contact">', '<section class="contact" id="contact">')
          main.write_text(source)

          html = Path('index.html')
          page = html.read_text().replace('href="/favicon.svg"', 'href="%BASE_URL%favicon.svg"')
          html.write_text(page)

          nav = Path('src/components/navbar.js')
          if nav.exists():
              source = nav.read_text()
              source = source.replace('href="#"', 'href="#home"', 1)
              source = source.replace('href="#"', 'href="#products"', 1)
              source = source.replace('href="#"', 'href="#about"', 1)
              source = source.replace('href="#"', 'href="#contact"', 1)
              nav.write_text(source)

          products = Path('src/data/products.js')
          if products.exists():
              source = products.read_text().replace('image:"/products/', 'image: import.meta.env.BASE_URL + "products/')
              products.write_text(source)
          PY

      - name: Add responsive and accessibility refinements
        run: |
          cat >> src/style.css <<'EOF'

          /* Portfolio-ready responsive refinements */
          html { scroll-padding-top: 88px; }
          body { overflow-x: clip; }
          img { max-width: 100%; height: auto; }
          button, input, textarea { font: inherit; }
          button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 2px solid #55b6ff;
            outline-offset: 4px;
          }
          .products-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
          .contact-form input, .contact-form textarea { width: 100%; max-width: 100%; }
          .mobile-menu { max-width: min(320px, 85vw); }
          @media (max-width: 768px) {
            main { width: min(100% - 36px, 620px); }
            .products, .about, .contact { padding-left: 18px; padding-right: 18px; }
            .products-header { margin-bottom: 48px; }
            .products-grid { gap: 22px; }
            .product-info { padding: 24px; }
            .product-info h3 { font-size: 1.55rem; }
            .about { gap: 36px; }
            .contact-form { width: 100%; }
          }
          @media (max-width: 420px) {
            .hero-title { overflow-wrap: anywhere; }
            .product-image { height: 230px; }
            .product-image img { max-width: 70%; }
            .section-title { font-size: clamp(2rem, 10vw, 2.5rem); }
          }
          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
              scroll-behavior: auto !important;
              animation-duration: .01ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: .01ms !important;
            }
          }
          EOF

      - name: Ensure generated and dependency files are not committed
        run: |
          cat >> .gitignore <<'EOF'
          node_modules/
          dist/
          .DS_Store
          .env
          .env.*
          !.env.example
          EOF

      - name: Commit extracted project and delete archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Apex Nutrition source into repository root"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
