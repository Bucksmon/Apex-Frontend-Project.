name: Deploy Apex Nutrition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project archive
        run: |
          unzip -q apex-nutrition.zip
          rm -rf apex-nutrition/node_modules

      - name: Prepare project for GitHub Pages and mobile
        working-directory: apex-nutrition
        run: |
          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';
          export default defineConfig({
            base: '/Apex-Frontend-Project./',
            build: { outDir: 'dist', emptyOutDir: true }
          });
          EOF
          python3 - <<'PY'
          from pathlib import Path
          main = Path('src/main.js')
          s = main.read_text()
          s = s.replace('src="/products/', 'src="${import.meta.env.BASE_URL}products/')
          s = s.replace('<section class="hero">', '<section class="hero" id="home">')
          s = s.replace('<section class="products">', '<section class="products" id="products">')
          s = s.replace('<section class="about">', '<section class="about" id="about">')
          s = s.replace('<section class="contact">', '<section class="contact" id="contact">')
          s += """
          const exploreButton = document.querySelector('.hero .primary-btn');
          exploreButton?.addEventListener('click', () => {
            document.querySelector('#products')?.scrollIntoView({ behavior: 'smooth' });
          });

          const contactForm = document.querySelector('.contact-form');
          contactForm?.addEventListener('submit', (event) => {
            event.preventDefault();
            const button = contactForm.querySelector('button[type="submit"], button');
            if (!contactForm.reportValidity()) return;
            if (button) {
              button.textContent = 'Thanks — demo message received';
              button.disabled = true;
            }
            contactForm.reset();
          });
          """
          main.write_text(s)

          products = Path('src/data/products.js')
          if products.exists():
            s = products.read_text().replace('image:"/products/', 'image: import.meta.env.BASE_URL + "products/')
            products.write_text(s)

          nav = Path('src/components/navbar.js')
          if nav.exists():
            s = nav.read_text()
            s = s.replace('<a href="#">Home</a>', '<a href="#home">Home</a>')
            s = s.replace('<a href="#">Products</a>', '<a href="#products">Products</a>')
            s = s.replace('<a href="#">About</a>', '<a href="#about">About</a>')
            s = s.replace('<a href="#">Contact</a>', '<a href="#contact">Contact</a>')
            s = s.replace('<a href="#products">Products</a>', '<a href="#products">Products</a>')
            nav.write_text(s)

          main = Path('src/main.js')
          s = main.read_text()
          s += """
          const mobileMenu = document.querySelector('.mobile-menu');
          const mobileMenuButton = document.querySelector('.menu-btn');
          mobileMenu?.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => {
            mobileMenu.classList.remove('active');
            mobileMenuButton?.setAttribute('aria-expanded', 'false');
            if (mobileMenuButton) mobileMenuButton.textContent = '☰';
          }));
          """
          main.write_text(s)
          """
          PY
          cat >> src/style.css <<'EOF'

          /* Portfolio-ready responsive refinements */
          html { scroll-padding-top: 88px; }
          body { overflow-x: clip; }
          img { max-width: 100%; height: auto; }
          button, input, textarea { font: inherit; }
          button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
            outline: 2px solid #55b6ff;
            outline-offset: 4px;
          }
          .products-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
          .contact-form input, .contact-form textarea { width: 100%; max-width: 100%; }
          .mobile-menu { max-width: min(320px, 85vw); }
          @media (max-width: 768px) {
            main { width: min(100% - 36px, 620px); }
            .products, .about, .contact { padding-left: 18px; padding-right: 18px; }
            .products-header { margin-bottom: 48px; }
            .products-grid { gap: 22px; }
            .product-info { padding: 24px; }
            .product-info h3 { font-size: 1.55rem; }
            .about { gap: 36px; }
            .contact-form { width: 100%; }
          }
          @media (max-width: 420px) {
            .hero-title { overflow-wrap: anywhere; }
            .product-image { height: 230px; }
            .product-image img { max-width: 70%; }
            .section-title { font-size: clamp(2rem, 10vw, 2.5rem); }
          }
          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
              scroll-behavior: auto !important;
              animation-duration: .01ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: .01ms !important;
            }
          }
          EOF

      - name: Install dependencies
        working-directory: apex-nutrition
        run: npm ci

      - name: Build site
        working-directory: apex-nutrition
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apex-nutrition/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
